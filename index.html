<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Document Translator - DEVRAM RABARI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Libraries for PDF export & Word (.docx) reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --gold: #d97706;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 12px;
            border-bottom: 4px solid var(--gold);
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* File Upload Box */
        .upload-area {
            background: var(--card-bg);
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            background: #283548;
        }

        .upload-area p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .translator-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .translator-box {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        select {
            background: var(--bg-main);
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 230px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-light);
            padding: 12px;
            font-size: 15px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }
        .btn-success { background: #15803d; color: white; }
        .btn-success:hover { background: #166534; }

        .status {
            text-align: center;
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: 500;
        }

        /* Printable Template for PDF */
        #pdfContent {
            display: none;
            padding: 30px;
            background: white;
            color: black;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DEVRAM RABARI</h1>
        <p>AI Document Translator & Premium PDF Generator</p>
    </header>

    <!-- File Upload Section -->
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p style="font-size: 16px; font-weight: 600; color: #60a5fa; margin-bottom: 4px;">📂 ફાઇલ અપલોડ કરો (Upload File)</p>
        <p>Word Document (.docx) અથવા Text ફાઇલ (.txt) અપલોડ કરો</p>
        <input type="file" id="fileInput" style="display:none" accept=".docx,.txt" onchange="handleFileUpload(event)">
    </div>

    <div class="translator-box">
        <!-- Input Panel -->
        <div class="panel">
            <div class="panel-header">
                <label style="font-weight:600;">મૂળ ભાષા (From):</label>
                <select id="fromLang">
                    <option value="autodetect">ઓટો ડિટેક્ટ (Auto Detect)</option>
                    <option value="gu">ગુજરાતી (Gujarati)</option>
                    <option value="en" selected>અંગ્રેજી (English)</option>
                    <option value="hi">હિન્દી (Hindi)</option>
                    <option value="mr">મરાઠી (Marathi)</option>
                    <option value="pa">પંજાબી (Punjabi)</option>
                    <option value="es">સ્પેનિશ (Spanish)</option>
                    <option value="fr">ફ્રેન્ચ (French)</option>
                    <option value="ar">અરબી (Arabic)</option>
                </select>
            </div>
            <textarea id="inputText" placeholder="અહીં લખાણ ટાઇપ કરો, પેસ્ટ કરો અથવા ઉપરથી ફાઇલ અપલોડ કરો..."></textarea>
            <div class="btn-group">
                <button class="btn-secondary" onclick="clearText()">🗑️ સાફ કરો</button>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <div class="panel-header">
                <label style="font-weight:600;">ભાષાંતર ભાષા (To):</label>
                <select id="toLang">
                    <option value="gu" selected>ગુજરાતી (Gujarati)</option>
                    <option value="en">અંગ્રેજી (English)</option>
                    <option value="hi">હિન્દી (Hindi)</option>
                    <option value="mr">મરાઠી (Marathi)</option>
                    <option value="pa">પંજાબી (Punjabi)</option>
                    <option value="es">સ્પેનિશ (Spanish)</option>
                    <option value="fr">ફ્રેન્ચ (French)</option>
                    <option value="ar">અરબી (Arabic)</option>
                </select>
            </div>
            <textarea id="outputText" readonly placeholder="ભાષાંતર થયેલું લખાણ અહીં દેખાશે..."></textarea>
            <div class="btn-group">
                <button class="btn-secondary" onclick="speakText()">🔊 સાંભળો</button>
                <button class="btn-secondary" onclick="copyText()">📋 કૉપી</button>
                <button class="btn-success" onclick="downloadPDF()">📄 HD PDF</button>
            </div>
        </div>
    </div>

    <button class="btn-primary" onclick="translateText()">🌐 AI દ્વારા ભાષાંતર કરો (Translate)</button>
    <div class="status" id="statusMsg"></div>

    <!-- Hidden Template for PDF Printing -->
    <div id="pdfContainer">
        <div id="pdfContent">
            <div style="text-align: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin:0; color: #1e3a8a; font-size: 24px;">DEVRAM RABARI</h2>
                <p style="margin:4px 0 0 0; color: #64748b; font-size: 13px;">Official AI Translated Document Report</p>
            </div>
            <div style="margin-bottom: 15px; font-size: 12px; color: #475569; text-align: right;" id="pdfDate"></div>
            
            <h4 style="color: #1e3a8a; margin-bottom: 6px;">Original Document:</h4>
            <div id="pdfOriginal" style="background: #f8fafc; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; white-space: pre-wrap; font-size: 13px; margin-bottom: 16px;"></div>
            
            <h4 style="color: #1e3a8a; margin-bottom: 6px;">AI Translated Output:</h4>
            <div id="pdfTranslated" style="background: #eff6ff; padding: 12px; border: 1px solid #bfdbfe; border-radius: 6px; white-space: pre-wrap; font-size: 13.5px; font-weight: bold; color: #0f172a;"></div>
        </div>
    </div>
</div>

<script>
    // Handle DOCX / TXT File Uploads
    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const status = document.getElementById('statusMsg');
        status.innerText = '⏳ ફાઇલ વંચાઈ રહી છે...';

        if (file.name.endsWith('.txt')) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('inputText').value = evt.target.result;
                status.innerText = '✅ TXT ફાઇલ સફળતાપૂર્વક અપલોડ થઈ ગઈ!';
            };
            reader.readAsText(file);
        } else if (file.name.endsWith('.docx')) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                mammoth.extractRawText({ arrayBuffer: evt.target.result })
                    .then(function(result) {
                        document.getElementById('inputText').value = result.value;
                        status.innerText = '✅ Word (.docx) ફાઇલ સફળતાપૂર્વક વાંચી લેવાઈ!';
                    })
                    .catch(function(err) {
                        status.innerText = '❌ ફાઇલ વાંચવામાં ભૂલ આવી.';
                    });
            };
            reader.readAsArrayBuffer(file);
        } else {
            alert('માત્ર .docx અથવા .txt ફાઇલ અપલોડ કરો.');
            status.innerText = '';
        }
    }

    // AI Translation Function
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const from = document.getElementById('fromLang').value;
        const to = document.getElementById('toLang').value;
        const output = document.getElementById('outputText');
        const status = document.getElementById('statusMsg');

        if (!text) {
            alert('કૃપા કરીને લખાણ ટાઇપ કરો અથવા ફાઇલ અપલોડ કરો.');
            return;
        }

        status.innerText = '⏳ AI ભાષાંતર થઈ રહ્યું છે, રાહ જુઓ...';
        output.value = '';

        let langPair = `${from === 'autodetect' ? 'en' : from}|${to}`;

        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
            const data = await res.json();

            if (data.responseData) {
                output.value = data.responseData.translatedText;
                status.innerText = '✅ ભાષાંતર સફળતાપૂર્વક પૂરું થયું!';
            } else {
                status.innerText = '❌ ભાષાંતરમાં ભૂલ આવી. પુનઃ પ્રયાસ કરો.';
            }
        } catch (err) {
            status.innerText = '❌ નેટવર્ક કનેક્શન તપાસો.';
        }
    }

    function copyText() {
        const text = document.getElementById('outputText').value;
        if (!text) return alert('કૉપી કરવા માટે કોઈ લખાણ નથી.');
        navigator.clipboard.writeText(text);
        alert('લખાણ કૉપી થઈ ગયું!');
    }

    function clearText() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        document.getElementById('statusMsg').innerText = '';
        document.getElementById('fileInput').value = '';
    }

    function speakText() {
        const text = document.getElementById('outputText').value;
        if (!text) return alert('સાંભળવા માટે લખાણ નથી.');
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }

    // HD PDF Generation
    function downloadPDF() {
        const original = document.getElementById('inputText').value;
        const translated = document.getElementById('outputText').value;

        if (!translated) {
            alert('PDF બનાવવા માટે ભાષાંતર થયેલું લખાણ હોવું જરૂરી છે.');
            return;
        }

        document.getElementById('pdfOriginal').innerText = original;
        document.getElementById('pdfTranslated').innerText = translated;
        document.getElementById('pdfDate').innerText = 'તારીખ: ' + new Date().toLocaleDateString('gu-IN');

        const element = document.getElementById('pdfContent');
        element.style.display = 'block';

        const opt = {
            margin:       10,
            filename:     `DEVRAM_RABARI_Translation_${new Date().toISOString().split('T')[0]}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.style.display = 'none';
        });
    }
</script>

</body>
</html>
